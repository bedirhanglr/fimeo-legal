<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fimeo Legal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5fa; --surface: #ffffff; --border: #ddd5e8;
    --text: #211a2e; --text-muted: #675e7a;
    --accent: #7b3fe4; --accent-strong: #5c16c9;
    --shadow: 0 1px 2px rgba(33,26,46,0.06), 0 8px 24px -12px rgba(33,26,46,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a12; --surface: #16121e; --border: #2c2438;
      --text: #f1edf7; --text-muted: #a89fbc;
      --accent: #b083ff; --accent-strong: #9b6bff;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -14px rgba(0,0,0,0.55);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px;
  }
  .card { max-width: 420px; width: 100%; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-bottom: 10px; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 32px; font-weight: 600; margin: 0 0 28px; }
  nav { display: flex; flex-direction: column; gap: 12px; }
  a.link {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; text-decoration: none; color: var(--text); font-weight: 600;
    box-shadow: var(--shadow);
  }
  a.link span.arrow { color: var(--accent-strong); font-weight: 400; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Fimeo</div>
    <h1>Legal &amp; Support</h1>
    <nav>
      <a class="link" href="privacy.html">Privacy Policy <span class="arrow">→</span></a>
      <a class="link" href="terms.html">Terms of Service <span class="arrow">→</span></a>
      <a class="link" href="support.html">Support <span class="arrow">→</span></a>
    </nav>
  </div>
</body>
</html>
